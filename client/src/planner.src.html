<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy brand band with gold rule; view tabs; filter strip; work area per view (board trays, backlog sections, timeline grid, calendar grid, analytics panels); card detail in a right drawer. */
:root {
  --navy: #0D1B3D; --teal: #108C8C; --teal-2: #8ED0D0; --gold: #E3B23C;
  --paper: #f2f2f2; --tray: #e3e8ee; --card: #ffffff; --raise: #f6f8fa;
  --ink: #0D1B3D; --ink-2: #435069; --muted: #687490; --line: #d6dce5; --line-2: #c0c8d4;
  --accent: #108C8C; --accent-ink: #0b6b6b; --accent-soft: #dcf0f0; --on-accent: #ffffff;
  --head: #0D1B3D; --on-head: #ffffff; --head-2: #8ED0D0;
  --btn: #0D1B3D; --on-btn: #ffffff;
  --crit: #d03b3b; --crit-ink: #b42318; --crit-soft: #fdecea;
  --warn: #fab219; --warn-ink: #8a5600; --warn-soft: #fff4d9;
  --good: #0ca30c; --good-ink: #006300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --grid: #e1e0d9; --axis: #c3c2b7; --shadow: 0 1px 0 rgba(13,27,61,.05), 0 1px 3px rgba(13,27,61,.1);
  --f-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #081128; --tray: #0f1b38; --card: #14234a; --raise: #1a2c57;
  --ink: #eef2f8; --ink-2: #b5c0d6; --muted: #8a97b4; --line: #22345f; --line-2: #2f4474;
  --accent: #3fb8b8; --accent-ink: #8ED0D0; --accent-soft: #0f3a48; --on-accent: #081128;
  --head: #050c1f; --on-head: #ffffff; --head-2: #8ED0D0;
  --btn: #8ED0D0; --on-btn: #0D1B3D;
  --crit-ink: #ff8a80; --crit-soft: #3a1c22; --warn-ink: #fab219; --warn-soft: #362a10; --good-ink: #3ccf3c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --grid: #24314f; --axis: #3a4a70; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #081128; --tray: #0f1b38; --card: #14234a; --raise: #1a2c57;
  --ink: #eef2f8; --ink-2: #b5c0d6; --muted: #8a97b4; --line: #22345f; --line-2: #2f4474;
  --accent: #3fb8b8; --accent-ink: #8ED0D0; --accent-soft: #0f3a48; --on-accent: #081128;
  --head: #050c1f; --on-head: #ffffff; --head-2: #8ED0D0;
  --btn: #8ED0D0; --on-btn: #0D1B3D;
  --crit-ink: #ff8a80; --crit-soft: #3a1c22; --warn-ink: #fab219; --warn-soft: #362a10; --good-ink: #3ccf3c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --grid: #24314f; --axis: #3a4a70; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.band { background: var(--head); color: var(--on-head); border-bottom: 3px solid var(--gold); }
.band-in { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 9px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 38px; height: 38px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; flex: none; }
.brand .wm { display: flex; flex-direction: column; line-height: 1.05; }
.brand .wm small { font-size: 9px; font-weight: 500; letter-spacing: .32em; color: var(--head-2); }
.brand .wm b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .06em; }
.brand .wm i { font-style: normal; font-size: 9.5px; font-weight: 600; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.board-btn { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; background: rgba(255,255,255,.08); color: var(--on-head); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; }
.board-btn:hover { background: rgba(255,255,255,.14); }
.board-btn .bname { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.band .bkey { background: var(--gold); color: var(--navy); }
.bkey { font-family: var(--f-mono); font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
.spacer { flex: 1; }
.band .btn { background: transparent; color: var(--on-head); border-color: rgba(255,255,255,.28); }
.band .btn:hover { background: rgba(255,255,255,.1); }
.tabbar { background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 10px 12px 9px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--gold); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; padding: 6px 11px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--raise); }
.btn.primary { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.btn.primary:hover { opacity: .9; }
.btn.teal { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--tray); }
.btn.danger { color: var(--crit-ink); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.iconbtn { border: 0; background: transparent; border-radius: 6px; padding: 4px 6px; color: var(--muted); line-height: 1; }
.iconbtn:hover { background: var(--line); color: var(--ink); }
.iconbtn[disabled] { opacity: .35; cursor: not-allowed; }

.notice { font-size: 13px; padding-block: 7px; background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.notice.err { background: var(--crit-soft); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding-block: 10px; border-bottom: 1px solid var(--line); }
.f { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f > span { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field, .filters select, .filters input { border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; padding: 5px 8px; min-width: 0; font-size: 13px; }
.filters select { max-width: 160px; }
.filters input[type=search] { width: 200px; }
.active-n { font-size: 12px; color: var(--accent-ink); font-weight: 700; padding-bottom: 6px; }

.ribbon { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 10px 0; }
.ribbon .sp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; min-width: 0; }
.ribbon .sp b { font-weight: 700; }
.prog { width: 120px; height: 6px; border-radius: 3px; background: var(--tray); overflow: hidden; display: inline-block; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.wall { overflow-x: auto; padding-block: 14px 28px; }
.lane { margin-bottom: 14px; }
.lane-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; position: sticky; left: 0; width: max-content; }
.lane-h h3 { font-size: 13.5px; font-weight: 700; }
.lane-h .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lists { display: flex; gap: 12px; align-items: flex-start; width: max-content; }
.list { width: 284px; flex: none; background: var(--tray); border-radius: 12px; display: flex; flex-direction: column; max-width: 84vw; border: 1.5px solid transparent; }
.list.overwip { border-color: var(--crit); }
.list-h { display: flex; align-items: center; gap: 8px; padding: 10px 8px 4px 12px; }
.list-h h3 { font-weight: 700; font-size: 14px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list-h .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.list-h .count.over { color: var(--crit-ink); font-weight: 600; }
.list-sub { margin: 0 12px 4px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.list-sub span { display: inline-flex; align-items: center; gap: 4px; }
.wipwarn { color: var(--crit-ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.list-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 8px; min-height: 28px; }
.list-body.over { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; }
.drop-mark { height: 3px; border-radius: 2px; background: var(--gold); margin: -2px 0; }
.add-card { margin: 0 8px 10px; text-align: left; border: 0; background: transparent; color: var(--ink-2); padding: 6px 8px; border-radius: 7px; font-weight: 500; }
.add-card:hover { background: var(--line); color: var(--ink); }
.new-list { width: 250px; flex: none; border: 1.5px dashed var(--line-2); background: transparent; border-radius: 12px; padding: 12px; color: var(--ink-2); text-align: left; font-weight: 600; }
.new-list:hover { border-color: var(--accent); color: var(--accent-ink); }
.inline-add { display: flex; flex-direction: column; gap: 6px; margin: 0 8px 10px; }
.inline-add textarea, .inline-add input { width: 100%; border: 1px solid var(--accent); border-radius: 8px; padding: 8px; background: var(--card); resize: vertical; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.card { position: relative; background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 9px 10px 8px; cursor: pointer; border: 1px solid transparent; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.card:hover { border-color: var(--line-2); }
.card.dragging { opacity: .4; }
.card.overdue { border-color: var(--crit); }
.card.soon { border-color: var(--warn); }
.card.blocked { padding-top: 14px; }
.hazard { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(135deg, var(--crit) 0 7px, var(--card) 7px 13px); }
.c-top { display: flex; align-items: center; gap: 6px; font-size: 11px; min-width: 0; }
.c-top .key { font-family: var(--f-mono); color: var(--muted); }
.card h4 { font-weight: 600; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 7px 1px 5px; border-radius: 99px; background: var(--raise); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.epic-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.epic-chip i { width: 4px; height: 12px; border-radius: 2px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--raise); color: var(--ink-2); white-space: nowrap; }
.c-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.c-meta .m { display: inline-flex; align-items: center; gap: 3px; }
.pts { font-family: var(--f-mono); font-size: 11px; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--tray); color: var(--ink-2); display: inline-grid; place-items: center; }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.due.overdue { background: var(--crit-soft); color: var(--crit-ink); font-weight: 700; }
.due.soon { background: var(--warn-soft); color: var(--warn-ink); font-weight: 700; }
.due.done { color: var(--good-ink); }
.blk { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--crit-ink); }
.aging { font-size: 11px; color: var(--muted); }
.aging.old { color: var(--warn-ink); font-weight: 600; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; background: var(--navy); color: #ffffff; flex: none; }
.prio, .tico { display: inline-flex; flex: none; }
.empty-list { font-size: 12px; color: var(--muted); padding: 4px 4px 6px; }

.scrim { position: fixed; inset: 0; background: rgba(5,12,31,.5); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); z-index: 41; background: var(--card); box-shadow: -8px 0 30px rgba(0,0,0,.2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer-b { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.title-in { width: 100%; font-family: var(--f-display); font-weight: 800; font-size: 21px; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; background: transparent; }
.title-in:hover, .title-in:focus { border-color: var(--line-2); background: var(--card); }
.grid-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; }
.fl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fl > span { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.fl .field, .fl select, .fl input, .fl textarea { width: 100%; }
textarea.field { resize: vertical; min-height: 70px; line-height: 1.45; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.sec-h h3 { font-size: 14.5px; font-weight: 800; }
.sec-h .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lblpick { display: flex; flex-wrap: wrap; gap: 6px; }
.lblpick button { border: 1px solid var(--line-2); background: var(--card); border-radius: 99px; font-size: 12px; padding: 2px 9px 2px 6px; display: inline-flex; align-items: center; gap: 5px; }
.lblpick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.blockbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.blockbox.on { border-color: var(--crit); background: var(--crit-soft); }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.items { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; flex-wrap: wrap; }
.item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item a { color: var(--accent-ink); }
.ck { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; }
.ck input[type=checkbox] { margin-top: 3px; accent-color: var(--teal); }
.ck .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ck.done .t { text-decoration: line-through; color: var(--muted); }
.comment { border-left: 2px solid var(--line-2); padding: 2px 0 2px 10px; }
.comment .meta, .hist .meta { font-size: 12px; color: var(--muted); }
.comment p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.hist li { list-style: none; display: grid; grid-template-columns: 12px 1fr; gap: 8px; }
.hist ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.hist .tick { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); margin-top: 5px; }
.err-text { color: var(--crit-ink); font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.ro-banner { font-size: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--ink-2); }

.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal.sm { width: min(460px, calc(100vw - 24px)); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-size: 18px; font-weight: 800; flex: 1; }
.modal-b { padding: 16px 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 18px 0; border-bottom: 1px solid var(--line); }
.subtabs button { border: 0; background: transparent; padding: 7px 10px; border-bottom: 3px solid transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.subtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.cfg-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.cfg-row .field { width: 100%; }
.cfg-row .swatches { grid-column: 2 / -1; }
.swatches { display: flex; gap: 3px; flex-wrap: wrap; }
.sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--ink); }

.pop { position: absolute; z-index: 45; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 6px; min-width: 230px; max-width: min(360px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto; }
.pop .mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 9px; border-radius: 6px; }
.pop .mi:hover { background: var(--raise); }
.pop .mi.cur { background: var(--accent-soft); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
.pop .ph { padding: 6px 9px 2px; }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #ffffff; padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); border-left: 3px solid var(--gold); }

.empty { max-width: 540px; margin: 48px auto; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { font-weight: 800; font-size: 24px; }

  </div>`;
}

/* ---------- calendar ---------- */
function renderCalendar(b) {
  if (!S.cal) { const t = today0(); S.cal = { y: t.getFullYear(), m: t.getMonth() }; }
  const { y, m } = S.cal;
  const first = new Date(y, m, 1), start = addDays(first, -((first.getDay() + 6) % 7));
  const last = new Date(y, m + 1, 0), end = addDays(last, 6 - ((last.getDay() + 6) % 7));
  const cards = [...S.cards.values()].filter(c => c.boardId === b.id && !c.archived && c.due && passFilters(c, b));
  const byDay = {}; cards.forEach(c => (byDay[c.due] = byDay[c.due] || []).push(c));
  const marks = {}; (b.sprints || []).forEach(s => { if (s.start) (marks[s.start] = marks[s.start] || []).push('Início · ' + s.name); if (s.end) (marks[s.end] = marks[s.end] || []).push('Fim · ' + s.name); });
  const td = ymd(today0());
  let cells = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const k = ymd(d), list = (byDay[k] || []).sort((a, z) => (isDone(a) ? 1 : 0) - (isDone(z) ? 1 : 0));
    cells += `<div class="day ${d.getMonth() !== m ? 'out' : ''} ${k === td ? 'today' : ''}"><span class="dn">${d.getDate()}</span>${(marks[k] || []).map(t => `<span class="spm">${esc(t)}</span>`).join('')}${list.slice(0, 4).map(c => `<button class="ev ${isDone(c) ? 'done' : dueState(c)}" data-act="open-card" data-id="${c.id}" data-tip="${esc(cardKey(c) + ' · ' + c.title + (c.assignee ? '\n' + c.assignee : ''))}">${esc(c.title)}</button>`).join('')}${list.length > 4 ? `<span class="more">+${list.length - 4} itens</span>` : ''}</div>`;
  }
  const noDue = [...S.cards.values()].filter(c => c.boardId === b.id && !c.archived && !c.due && !isDone(c) && passFilters(c, b)).length;
  return `<div class="cal-wrap gut">
    <div class="cal-nav"><button class="btn sm" data-act="cal-nav" data-d="-1" aria-label="Mês anterior">‹</button><h2>${esc(first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }))}</h2><button class="btn sm" data-act="cal-nav" data-d="1" aria-label="Próximo mês">›</button><button class="btn ghost sm" data-act="cal-nav" data-d="0">Hoje</button><span class="spacer"></span><span class="hint">${noDue} item(ns) em aberto sem prazo não aparecem aqui.</span></div>
    <div class="cal-scroll"><div class="cal">${cells}</div></div>
  </div>`;
}

function swatchesCard(c, dis) { return `<span class="swatches">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<button type="button" class="sw" style="background:${sc(n)}" data-act="card-color" data-c="${n}" aria-pressed="${(c.color || 7) === n}" aria-label="Cor ${n}" ${dis}></button>`).join('')}</span>`; }

/* ---------- charts ---------- */
function lineChart(o) {
  const W = o.w || 640, H = o.h || 230, L = 34, R = 12, T = 12, B = 26;
  const n = o.labels.length, iw = W - L - R, ih = H - T - B;
  const nice = o.yMax <= 5 ? Math.max(1, Math.ceil(o.yMax)) : Math.ceil(o.yMax / 5) * 5;
  const X = i => L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw), Y = v => T + ih - (v / nice) * ih;
  let g = '';
  const ticks = nice <= 5 ? Array.from({ length: nice + 1 }, (_, i) => i) : [0, .2, .4, .6, .8, 1].map(f => nice * f);
  ticks.forEach(v => { g += `<line class="${v ? 'gl' : 'ax'}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fmtNum(v, 0)}</text>`; });
  const every = Math.ceil(n / 8);
  o.labels.forEach((l, i) => { if ((i % every === 0 && (n - 1 - i >= every / 2 || i === n - 1)) || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  if (o.areas) {
    let base = o.labels.map(() => 0);
    o.areas.forEach(a => {
      const top = base.map((v, i) => v + a.values[i]);
      const d = 'M' + top.map((v, i) => `${X(i)},${Y(v)}`).join('L') + 'L' + base.map((v, i) => `${X(i)},${Y(v)}`).reverse().join('L') + 'Z';
      g += `<path d="${d}" fill="${a.color}" fill-opacity=".85" stroke="var(--card)" stroke-width="1.5"/>`;
      base = top;
    });
  }
  if (o.markX != null) g += `<line x1="${X(o.markX)}" x2="${X(o.markX)}" y1="${T}" y2="${T + ih}" stroke="var(--gold)" stroke-width="2"/>`;
  (o.series || []).forEach(s => {

function biRange() {

}
function catAt(c, t) {

  const cards = [...S.cards.values()].filter(c => ids.has(c.boardId) && !c.archived && c.type !== 'epic' && passFilters(c, boardOf(c)));
  const [from, to] = biRange();
  const inP = iso => { if (!iso) return false; const d = new Date(iso); return d >= from && d <= to; };
  const open = cards.filter(c => !isDone(c));
  const overdue = open.filter(c => dueState(c) === 'overdue'), soon = open.filter(c => dueState(c) === 'soon'), blocked = open.filter(c => c.blocked);
  const doneP = cards.filter(c => isDone(c) && inP(c.completedAt));
  const avg = a => a.length ? a.reduce((p, z) => p + z, 0) / a.length : null;
  const avgLead = avg(doneP.map(c => (new Date(c.completedAt) - new Date(c.createdAt)) / DAY).filter(x => x >= 0));
  const avgCyc = avg(doneP.map(c => { const s = cycleStart(c); return s ? (new Date(c.completedAt) - s) / DAY : null; }).filter(x => x != null && x >= 0));
  const effortSet = cards.filter(c => (c.spent || 0) > 0 && (!isDone(c) || inP(c.completedAt)));

  cards.forEach(c => { const s = statusOf(boardOf(c), c.status); if (s && stMap.has(s.name)) stMap.get(s.name).n++; });
  const stRows = [...stMap.values()], stMax = Math.max(1, ...stRows.map(r => r.n));

  const byA = new Map();
  cards.forEach(c => { const k = c.assignee || 'Sem responsável'; if (!byA.has(k)) byA.set(k, { name: k, todo: 0, doing: 0, done: 0, overdue: 0, est: 0, spent: 0, blocked: 0, pts: 0 }); const r = byA.get(k); r[catOf(c)]++; if (dueState(c) === 'overdue') r.overdue++; if (c.blocked && !isDone(c)) r.blocked++; if (isDone(c) && inP(c.completedAt)) r.pts += c.points || 0; if ((c.spent || 0) > 0 && (!isDone(c) || inP(c.completedAt))) { r.est += c.estimate || 0; r.spent += c.spent || 0; } });

/* ---------- CSV ---------- */
function buildCSV(b) {
  const q = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['Código', 'Tipo', 'Título', 'Status', 'Lista', 'Responsável', 'Prioridade', 'Pontos', 'Estimativa (h)', 'Realizado (h)', 'Início', 'Prazo', 'Sprint', 'Épico', 'Etiquetas', 'Bloqueado', 'Motivo do impedimento', 'Criado em', 'Concluído em'];
  const rows = [...S.cards.values()].filter(c => c.boardId === b.id && !c.archived && passFilters(c, b)).sort((a, z) => (a.num || 0) - (z.num || 0)).map(c => [cardKey(c), TYPES[c.type].name, c.title, (statusOf(b, c.status) || {}).name, ((b.lists || []).find(l => l.id === c.listId) || {}).name, c.assignee, (prioOf(b, c.priority) || {}).name, c.points || '', String(c.estimate || '').replace('.', ','), String(c.spent || '').replace('.', ','), c.start, c.due, (sprintOf(c) || {}).name, (epicOf(c) || {}).title, (c.labels || []).map(id => ((b.labels || []).find(l => l.id === id) || {}).name).filter(Boolean).join(', '), c.blocked ? 'Sim' : 'Não', c.blockReason, isoDay(c.createdAt), isoDay(c.completedAt)]);
  return '﻿' + [head].concat(rows).map(r => r.map(q).join(';')).join('\r\n');
}

    createCard(bb, todoList || null, v, { type: 'subtask', parentId: p.id, sprintId: p.sprintId, assignee: p.assignee }); renderDrawer(true); setTimeout(() => $('#sub-new') && $('#sub-new').focus(), 0);
  }
  else if (k === 'add-wl') {
    const h = parseFloat(String($('#wl-h').value).replace(',', '.')); if (!(h > 0)) { toast('Informe as horas trabalhadas.'); return; }
    const d = $('#wl-d').value || ymd(today0()), n = $('#wl-n').value.trim();
    mutateCard(S.openCard, c => { c.worklog = c.worklog.concat({ id: uid('wl-'), by: myId(), at: nowISO(), date: d, hours: Math.round(h * 100) / 100, note: n.slice(0, 200) }); c.spent = Math.round(((c.spent || 0) + h) * 10) / 10; });
    renderDrawer(true);
  }
  else if (k === 'comment') { const v = $('#cd-comment').value.trim(); if (!v) return; mutateCard(S.openCard, c => { c.comments = c.comments.concat({ id: uid('cm-'), by: myId(), at: nowISO(), text: v.slice(0, 4000) }); }); renderDrawer(true); }
  else if (k === 'add-team') { const v = $('#team-name').value.trim(); if (!v) return; mutateBoard(S.modal.boardId, x => { if (!x.team.includes(v)) x.team.push(v); }, 'edit'); S.modal.force = true; renderModal(); }
  else if (k === 'person') {
    const v = $('#person-name').value.trim(); if (!v) return; const cid = S.modal.cardId;
    const c = S.cards.get(cid); mutateBoard(c.boardId, x => { if (!x.team.includes(v)) x.team.push(v); }, 'edit');
    S.modal = null; $('#layer').innerHTML = ''; S.openCard = cid; setCardField(cid, 'assignee', v); renderDrawer(true);
  }
  else if (k === 'save-view') { const v = $('#sv-name').value.trim(); if (!v) return; S.saved.push({ name: v.slice(0, 60), view: S.view, swim: S.swim, filters: Object.assign({}, S.filters) }); saveUI(); closeModal(); toast('Visão salva.'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.dataset.filter === 'q' ? t.value.trim() : t.value; renderFilters(); const el = document.getElementById(t.id); if (el) el.focus(); render(); return; }
  if (t.dataset.swim) { S.swim = t.value; S.adding = null; saveUI(); render(); return; }
  if (t.dataset.bi) { S.bi[t.dataset.bi] = t.value; if (t.dataset.bi === 'scope') S.bi.sprint = ''; saveUI(); renderFilters(); render(); return; }
  if (t.dataset.bksprint) { setCardField(t.dataset.bksprint, 'sprintId', t.value); return; }
  if (t.dataset.ck) { const id = t.dataset.ck; mutateCard(S.openCard, c => { const k = c.checklist.find(x => x.id === id); if (k) k.done = t.checked; }); renderDrawer(true); return; }
  if (t.dataset.cf) {
    const f = t.dataset.cf, id = S.openCard;
    if (f === 'assignee' && t.value === '__add') { t.value = S.cards.get(id).assignee || ''; openModal({ type: 'person', cardId: id, backTo: id }); setTimeout(() => $('#person-name') && $('#person-name').focus(), 30); return; }
    setCardField(id, f, t.type === 'checkbox' ? t.checked : t.value);
    renderDrawer(true);
    if (f === 'blocked' && t.checked) setTimeout(() => $('#cd-reason') && $('#cd-reason').focus(), 30);
    return;
  }
  if (t.id === 'att-file' && t.files && t.files[0]) {
    const file = t.files[0], cid = S.openCard;
    toast('Enviando ' + file.name + '…');
    S.assets.upload(file).then(r => { mutateCard(cid, c => { c.attachments = c.attachments.concat({ id: uid('at-'), name: file.name, assetId: r.id, url: '', by: myId(), at: nowISO() }); }); renderDrawer(true); toast('Arquivo anexado.'); }).catch(() => toast('Não foi possível enviar o arquivo. Tipos aceitos: imagem, PDF, vídeo ou texto, até 20 MB.'));
    return;
  }
  const m = S.modal; if (!m || m.type !== 'settings') return;
  if (t.dataset.cfg) {
    const k = t.dataset.cfg; let v = t.value.trim();
    if (k === 'name' && !v) { toast('O quadro precisa de um nome.'); t.value = S.boards.get(m.boardId).name; return; }
    if (k === 'key') { v = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); if (!v) { t.value = S.boards.get(m.boardId).key; return; } }
    mutateBoard(m.boardId, x => { x[k] = v; });
  } else if (t.dataset.cfgarr) {
    const v = t.value.trim(); if (!v) { toast('O nome não pode ficar vazio.'); m.force = true; renderModal(); return; }
    mutateBoard(m.boardId, x => { const it = x[t.dataset.cfgarr].find(q => q.id === t.dataset.id); if (it) it[t.dataset.k] = v; });
    if (t.dataset.k !== 'name') { m.force = true; setTimeout(renderModal, 0); }
  } else if (t.dataset.listst !== undefined) {
    mutateBoard(m.boardId, x => { const l = x.lists.find(q => q.id === t.dataset.listst); if (l) l.status = t.value; });
  } else if (t.dataset.member) {
    mutateBoard(m.boardId, x => { x.members[t.dataset.member] = t.value; });
  }
});
let qT, sT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter === 'q') { clearTimeout(qT); qT = setTimeout(() => { S.filters.q = t.value.trim(); $('#main').innerHTML = renderMain(); }, 160); }
  if (t.dataset.search) {
    clearTimeout(sT); const q = t.value.trim();
    sT = setTimeout(async () => {
      const box = $('#mem-results'); if (!box || !S.user) return;
      let hits = []; try { hits = await S.user.search(q); } catch (err) {}
      const b = S.boards.get(S.modal.boardId);
      hits = hits.filter(h => h.id && h.id !== b.createdBy && !(b.members || {})[h.id]);
      box.innerHTML = hits.slice(0, 8).map(h => `<div class="item"><span class="grow"></span><button class="btn sm" data-act="add-member" data-id="${esc(h.id)}">Adicionar como editor</button></div>`).join('') || (q ? '<span class="hint">Ninguém encontrado.</span>' : '');
      $$('.item .grow', box).forEach((el, i) => { el.textContent = hits[i].name || 'Pessoa sem nome'; el.nextElementSibling.dataset.name = hits[i].name || ''; });
    }, 220);
  }
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.search && !e.target.value) e.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('focusout', () => { setTimeout(() => { if (S.drawerDirty && S.openCard) { const dr = $('#drawer'); const ae = document.activeElement; if (!dr || !dr.contains(ae) || !/INPUT|TEXTAREA|SELECT/.test(ae.tagName)) renderDrawer(); } }, 0); });

/* drag & drop: board cards and backlog rows */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && (e.target.closest('[data-card]') || e.target.closest('[data-bkcard]')); if (!c) return; dragId = c.dataset.card || c.dataset.bkcard; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
document.addEventListener('dragend', () => { dragId = null; $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.drop-mark').forEach(x => x.remove()); $$('.list-body.over').forEach(x => x.classList.remove('over')); $$('.bk-sec.drop').forEach(x => x.classList.remove('drop')); });
function dropBody(t) { if (!t.closest) return null; return t.closest('[data-drop]') || (t.closest('.list') && $('[data-drop]', t.closest('.list'))); }
function dropTarget(body, y) { const cs = $$('[data-card]', body).filter(x => x.dataset.card !== dragId); return cs.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null; }
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const sec = e.target.closest && e.target.closest('[data-sprint-drop]');
  if (sec) { e.preventDefault(); $$('.bk-sec.drop').forEach(x => { if (x !== sec) x.classList.remove('drop'); }); sec.classList.add('drop'); return; }
  const body = dropBody(e.target); if (!body) return;
  e.preventDefault();
  $$('.list-body.over').forEach(x => { if (x !== body) x.classList.remove('over'); }); body.classList.add('over');
  const before = dropTarget(body, e.clientY);
  let mark = $('.drop-mark'); if (!mark) { mark = document.createElement('div'); mark.className = 'drop-mark'; }
  if (before) body.insertBefore(mark, before); else body.appendChild(mark);
});
document.addEventListener('drop', e => {
  if (!dragId) return;
  const sec = e.target.closest && e.target.closest('[data-sprint-drop]');
  if (sec) { e.preventDefault(); const id = dragId; dragId = null; setCardField(id, 'sprintId', sec.dataset.sprintDrop); return; }
  const body = dropBody(e.target); if (!body) return;
  e.preventDefault(); const before = dropTarget(body, e.clientY); const id = dragId; dragId = null;
  const lane = body.dataset.lane != null && S.swim !== 'none' ? { by: S.swim, val: body.dataset.lane } : null;
  moveCard(id, body.dataset.drop, before ? before.dataset.card : null, lane);
});

boot();
})();

</script>
