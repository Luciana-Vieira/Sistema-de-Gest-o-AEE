<title>{{ORG_NOME}} · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral azul com navegação + área de trabalho clara; formulários em painel lateral deslizante. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F9FB; --ink:#0D1B3D; --muted:#5A6479; --line:#DCE2EA; --line-strong:#C3CCD8;
  --side:#0D1B3D; --side-ink:#EAF0F8; --side-muted:#93A3BF; --side-hover:#17294F;
  --teal:#108C8C; --teal-ink:#0A6E6E; --teal-soft:#E0F1F1; --sky:#8ED0D0; --gold:#E3B23C; --gold-soft:#FBF1D8;
  --ok:#1C7A52; --ok-soft:#E0F2E9; --warn:#8F5E06; --warn-soft:#FBEFD3; --bad:#B13A21; --bad-soft:#FBE4DD;
  --info:#1E5C9F; --info-soft:#E2ECF8; --mute:#636C7E; --mute-soft:#ECEEF2;
  --scrim:rgba(13,27,61,.42); --shadow:0 1px 2px rgba(13,27,61,.06),0 10px 30px rgba(13,27,61,.08);
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#081124; --surface:#0F1B35; --surface-2:#13213F; --ink:#E7ECF5; --muted:#9CA8BE; --line:#22314F; --line-strong:#33446A;
  --side:#050C1C; --side-ink:#E7ECF5; --side-muted:#8193B3; --side-hover:#122243;
  --teal:#35B0B0; --teal-ink:#6FCFCF; --teal-soft:#0F3237; --sky:#8ED0D0; --gold:#E8BE5A; --gold-soft:#372C12;
  --ok:#57C996; --ok-soft:#10301F; --warn:#E8BE5A; --warn-soft:#372C12; --bad:#F2896C; --bad-soft:#3A1A12;
  --info:#7FB2EE; --info-soft:#132A49; --mute:#A0A9BA; --mute-soft:#1C2742;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#081124; --surface:#0F1B35; --surface-2:#13213F; --ink:#E7ECF5; --muted:#9CA8BE; --line:#22314F; --line-strong:#33446A;
  --side:#050C1C; --side-ink:#E7ECF5; --side-muted:#8193B3; --side-hover:#122243;
  --teal:#35B0B0; --teal-ink:#6FCFCF; --teal-soft:#0F3237; --sky:#8ED0D0; --gold:#E8BE5A; --gold-soft:#372C12;
  --ok:#57C996; --ok-soft:#10301F; --warn:#E8BE5A; --warn-soft:#372C12; --bad:#F2896C; --bad-soft:#3A1A12;
  --info:#7FB2EE; --info-soft:#132A49; --mute:#A0A9BA; --mute-soft:#1C2742;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* App shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:28px;
  padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;overflow:auto}
.brand{display:grid;gap:4px}
.brand .b1{font-size:11px;letter-spacing:.32em;font-weight:500;color:var(--sky);display:flex;align-items:center;gap:8px}
.brand .b1::before,.brand .b1::after{content:"";flex:1;height:1px;background:var(--sky);opacity:.5}
.brand .b2{font-size:26px;font-weight:800;letter-spacing:.04em;color:#fff;line-height:1}
.brand .b3{height:2px;background:var(--gold);margin-top:6px}
@media (min-width:901px){.brand{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.brand{flex:0 0 auto;max-width:42vw}.brand .b2{overflow:hidden;text-overflow:ellipsis}}
.brand .b2{white-space:nowrap}
.brand .b1:empty,.brand .b4:empty{display:none}
.brand .b4{text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:var(--side-muted);font-weight:600;margin-top:2px}
nav.nav{display:grid;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--side-muted);font-weight:600;font-size:14px}
.nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:rgba(142,208,208,.16);color:var(--sky);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--side-muted)}
.me{display:flex;align-items:center;gap:10px}
.me img{width:28px;height:28px;border-radius:50%}
.me b{color:var(--side-ink);font-weight:600;display:block}
.tag-line{font-size:11px;line-height:1.5;color:var(--side-muted);border-top:1px solid rgba(147,163,191,.2);padding-top:12px}

.main{padding-block:28px 64px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px));min-width:0;display:grid;gap:24px;align-content:start;max-width:1280px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04161A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04161A}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0D1B3D}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.k-teal{border-top:3px solid var(--teal)}
.kpi.k-gold{border-top:3px solid var(--gold)}
.kpi.k-navy{border-top:3px solid var(--ink)}
.kpi.k-sky{border-top:3px solid var(--sky)}
.v.pos{color:var(--ok)} .v.neg{color:var(--bad)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .fi{display:grid;gap:4px;min-width:0}
.filters label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters input,.filters select{height:38px}
.filters .grow{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--sky)}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.row:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)} .amt.out{color:var(--bad)}
.amt.cx{color:var(--muted);text-decoration:line-through}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--mute-soft);color:var(--mute)}
.tipo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tipo.in{color:var(--ok)} .tipo.out{color:var(--bad)}

/* Empty / notices */
.empty{padding:40px 24px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:15px}
.empty p{margin:0;max-width:46ch}
.notice{border-radius:10px;padding:12px 14px;font-size:13px;display:block}
.notice > * + *{margin-top:6px}
.notice > span{display:block}
.notice.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.bad{background:var(--bad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.notice.info{background:var(--teal-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent)}
.notice b{font-weight:700}
.notice ul{margin:0;padding-left:18px}

/* Lists in painel */
.list{display:grid}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover .cell-main{color:var(--teal-ink)}
.li > div{min-width:0}
.funnel{display:grid;gap:12px}
.fun-row{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;align-items:center;gap:12px;font-size:13px}
.fun-bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.fun-bar span{display:block;height:100%;border-radius:6px}
.fun-row b{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:grid;gap:12px}
.mini-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.d-head .sub{color:var(--muted);font-size:12px;margin-top:4px}
.d-body{flex:1;overflow:auto;padding:20px 24px 32px;display:grid;gap:22px;align-content:start}
.d-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.d-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.req{color:var(--bad)}
.hint{font-size:11.5px;color:var(--muted)}
.ferr{font-size:12px;color:var(--bad);font-weight:600}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;padding:3px;gap:3px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg input:checked + span{background:var(--ink);color:var(--surface)}
.seg input:focus-visible + span{outline:2px solid var(--teal)}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--teal);background:var(--surface);margin-top:3px}
.tl .dot.g{border-color:var(--gold)}
.tl .meta{font-size:12px;color:var(--muted)}
.tl .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.hist{font-size:12.5px;display:grid;gap:8px}
.hist .h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.hist .when{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
details.more summary{cursor:pointer;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
details.more > div{margin-top:12px}
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.check-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row input{width:18px;height:18px}
.totline{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px}
.totline b{font-variant-numeric:tabular-nums}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--ink)}
.x:focus-visible{outline:2px solid var(--teal)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.loading{color:var(--muted);padding:24px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.mt0{margin:0}
.right{text-align:right}
.settings textarea{min-height:150px;font-size:13px}
.cbx{display:flex;align-items:center;gap:8px;font-size:13px}
.cbx input{width:16px;height:16px}

/* Abas do painel lateral */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 24px;overflow-x:auto;background:var(--surface);flex:none}
.tabs button{all:unset;cursor:pointer;padding:12px 12px 10px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--teal)}
.tabs .n{font-size:11px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.day{border-right:1px solid var(--line);min-height:260px;display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:none}
.day-h{padding:10px 10px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h .dn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day-h .dd{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.day.today .day-h{background:var(--teal-soft)} .day.today .dd{color:var(--teal-ink)}
.day-b{padding:8px;display:grid;gap:6px;align-content:start;flex:1}
.aula{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:1px;padding:7px 8px 7px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--teal);font-size:12px;min-width:0}
.aula:hover{border-color:var(--teal)} .aula:focus-visible{outline:2px solid var(--teal)}
.aula .t{font-weight:700;font-variant-numeric:tabular-nums}
.aula .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aula .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aula.s-realizada{border-left-color:var(--ok)} .aula.s-falta{border-left-color:var(--bad)} .aula.s-falta_just{border-left-color:var(--gold)}
.aula.s-cancelada,.aula.s-remarcada{border-left-color:var(--line-strong);opacity:.6} .aula.s-cancelada .n{text-decoration:line-through}
.aula.pend{background:var(--warn-soft)}
.bday{font-size:11px;font-weight:600;color:var(--ink);background:var(--gold-soft);border-radius:6px;padding:3px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-day{all:unset;cursor:pointer;font-size:12px;color:var(--muted);text-align:center;padding:5px;border-radius:6px;border:1px dashed var(--line-strong)}
.add-day:hover{color:var(--teal-ink);border-color:var(--teal)} .add-day:focus-visible{outline:2px solid var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.day{border-right:none;border-bottom:1px solid var(--line);min-height:0}.day:last-child{border-bottom:none}}
/* Alertas */

/* ---------- Agenda ---------- */
V.agenda=function(){
  const f=S.fAg,ini=f.semana,dias=[...Array(7)].map((_,i)=>addDays(ini,i)),fim=dias[6],t=hoje();
  const list=S.aulas.filter(a=>a.data>=ini&&a.data<=fim&&(!f.prof||a.profissional===f.prof)&&(!f.aluno||a.alunoId===f.aluno));
  const profs=[...new Set([...S.cfg.equipe,...S.aulas.map(a=>a.profissional).filter(Boolean)])];
  const alunosOpt=S.alunos.filter(a=>a.situacao!=="cancelada"&&a.situacao!=="concluida").sort((a,b)=>normTxt(a.nome).localeCompare(normTxt(b.nome))).map(a=>[a.id,a.nome]);
  const nv=aniversarios(ini,fim);
  const realiz=list.filter(a=>a.situacao==="realizada").length,faltas=list.filter(a=>a.situacao==="falta"||a.situacao==="falta_just").length,pend=list.filter(aulaPendente).length;
  const ativas=list.filter(a=>a.situacao!=="cancelada"&&a.situacao!=="remarcada").length;
  const mesIni=MESES[+ini.slice(5,7)-1],mesFim=MESES[+fim.slice(5,7)-1];
  return`<div class="head"><div><div class="eyebrow">Aulas e atendimentos</div><h1>Agenda</h1><p>Semana de ${fmtD(ini).slice(0,5)} a ${fmtD(fim)}${mesIni!==mesFim?"":" · "+esc(mesIni)}. Clique numa aula para registrar presença e o que foi trabalhado.</p></div>
  <div class="actions"><button class="btn" data-act="semana" data-d="-7" aria-label="Semana anterior">‹ Anterior</button><button class="btn" data-act="semana" data-d="0">Hoje</button><button class="btn" data-act="semana" data-d="7" aria-label="Próxima semana">Próxima ›</button>${S.canWrite?`<button class="btn" data-act="newReu">${ic("cal")}Reunião com lead</button><button class="btn primary" data-act="newAula">${ic("plus")}Agendar aula</button>`:""}</div></div>
  <div class="panel"><div class="panel-b"><div class="filters">
    <div class="fi"><label for="fg_p">Profissional</label><select id="fg_p" data-f="fAg.prof">${opts(profs,f.prof,"Todos")}</select></div>
    <div class="fi grow"><label for="fg_a">Aluno</label><select id="fg_a" data-f="fAg.aluno">${opts(alunosOpt,f.aluno,"Todos")}</select></div>
    <div class="stats"><div class="stat"><b>${ativas}</b>aulas</div><div class="stat"><b>${realiz}</b>realizadas</div><div class="stat"><b>${faltas}</b>faltas</div><div class="stat" style="${pend?"border-color:var(--gold)":""}"><b>${pend}</b>sem registro</div></div>
  </div></div></div>
  ${!S.ready.aulas?loadingRows():`<div class="week">${dias.map(d=>{
    const items=list.filter(a=>a.data===d).sort((a,b)=>(a.inicio||"").localeCompare(b.inicio||""));
    const bd=nv.filter(b=>b.data===d);
    return`<div class="day${d===t?" today":""}"><div class="day-h"><span class="dn">${DIAS[wd(d)]}${d===t?" · hoje":""}</span><span class="dd">${+d.slice(8)}<span class="small muted" style="font-weight:600">/${d.slice(5,7)}</span></span></div><div class="day-b">
      ${bd.map(b=>`<div class="bday" title="${esc(quemNiver(b))}">Aniv. ${esc(b.tipo==="aluno"?b.nome:b.nome+" ("+(b.parentesco||"resp.").toLowerCase()+")")}</div>`).join("")}
      ${items.map(a=>`<button class="aula s-${a.situacao}${aulaPendente(a)?" pend":""}" data-act="openAula" data-id="${a.id}"><span class="t">${esc(a.inicio||"")}–${esc(a.fim||"")}</span><span class="n">${esc(alunoNome(a.alunoId)||"Aluno removido")}</span><span class="m">${esc([a.profissional,a.situacao!=="agendada"?AULA_ST[a.situacao][0]:a.modalidade].filter(Boolean).join(" · "))}</span>${isOnline(a)&&a.situacao==="agendada"?`<span class="lk ${a.linkReuniao?"ok":"warn"}">${a.linkReuniao?"Link pronto":"Sem link"}</span>`:""}</button>`).join("")}
      ${f.aluno?"":S.reu.filter(r=>r.data===d&&r.situacao!=="cancelada"&&(!f.prof||r.profissional===f.prof)).sort((a,b)=>(a.inicio||"").localeCompare(b.inicio||"")).map(r=>`<button class="aula reu r-${r.situacao}" data-act="openReu" data-id="${r.id}"><span class="t">${esc(r.inicio||"")}–${esc(r.fim||"")}</span><span class="n">Reunião: ${esc(leadNome(r.leadId))}</span><span class="m">${esc([r.situacao!=="agendada"?REU_ST[r.situacao][0]:r.modalidade,r.profissional].filter(Boolean).join(" · "))}</span>${r.modalidade==="On-line"&&r.situacao==="agendada"?`<span class="lk ${r.linkReuniao?"ok":"warn"}">${r.linkReuniao?"Link pronto":"Sem link"}</span>`:""}</button>`).join("")}
      ${S.canWrite?`<button class="add-day" data-act="newAula" data-date="${d}" aria-label="Agendar aula em ${fmtD(d)}">+ aula</button>`:""}
    </div></div>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--teal)"></i>Agendada</span><span><i style="background:var(--ok)"></i>Realizada</span><span><i style="background:var(--bad)"></i>Falta</span><span><i style="background:var(--gold)"></i>Falta justificada</span><span><i style="background:var(--warn-soft);border:1px solid var(--gold)"></i>Já passou e está sem registro</span><span><i style="background:var(--gold)"></i>Reunião com lead</span></div>`}`;
};

/* ---------- Leads ---------- */
function leadsFiltrados(){const f=S.fLead,q=normTxt(f.q);return S.leads.filter(l=>(!f.st||l.status===f.st)&&(!f.origem||l.origem===f.origem)&&(!q||normTxt([l.nome,l.responsavel,l.telefone,l.email,l.instagram,l.interesse].join(" ")).includes(q)||digits(l.telefone).includes(digits(f.q)||"#"))).sort((a,b)=>(b.dataEntrada||"").localeCompare(a.dataEntrada||"")||(b.criadoEm||"").localeCompare(a.criadoEm||""))}
V.leads=function(){
  const f=S.fLead,list=leadsFiltrados();

  <div class="panel"><div class="panel-b"><div class="filters">
    <div class="fi grow"><label for="fl_q">Buscar</label><input id="fl_q" data-f="fLead.q" value="${esc(f.q)}" placeholder="Nome, telefone, e-mail ou interesse"></div>
    <div class="fi"><label for="fl_o">Origem</label><select id="fl_o" data-f="fLead.origem">${opts(S.cfg.origens,f.origem,"Todas")}</select></div>

  ${!S.ready.leads?loadingRows():list.length?`<div class="tbl-wrap"><table><thead><tr><th>Lead</th><th>Interesse</th><th>Origem</th><th>Entrada</th><th>Atendimento</th><th>Status</th></tr></thead><tbody>
  ${list.map(l=>`<tr class="row" data-act="openLead" data-id="${l.id}" tabindex="0"><td><div class="cell-main">${esc(l.nome)}</div><div class="cell-sub">${esc([fmtTel(l.telefone),l.email,l.instagram].filter(Boolean).join(" · "))}</div></td><td>${esc(l.interesse||"—")}</td><td>${esc(l.origem||"—")}</td><td class="num">${fmtD(l.dataEntrada)}</td><td>${esc(l.atendente||"—")}</td><td>${pill(LEAD_ST,l.status)}<div class="cell-sub">${(l.interacoes||[]).length} interações</div></td></tr>`).join("")}

  </div>`;
};

/* ---------- Alunos ---------- */

V.alunos=function(){

  </tbody></table></div>`:S.alunos.length?`<div class="empty"><h3>Nenhum aluno encontrado</h3><p>Confira a grafia do nome ou do CPF do responsável, ou escolha outra situação.</p></div>`:`<div class="empty"><h3>Nenhum aluno cadastrado ainda</h3><p>Você pode cadastrar diretamente ou converter um lead em aluno, aproveitando os dados já informados.</p>${S.canWrite?`<button class="btn primary" data-act="newAluno">${ic("plus")}Cadastrar aluno</button>`:""}</div>`}

};

/* ---------- Boletins (lista geral) ---------- */
function bolFiltrados(){const f=S.fBol,q=normTxt(f.q);
  return S.bol.filter(b=>{if(f.ano&&String(b.anoLetivo)!==f.ano)return false;if(f.per&&b.periodo!==f.per)return false;if(f.disc&&b.disciplina!==f.disc)return false;
    if(f.pub==="pub"&&!b.publicacao)return false;if(f.pub==="ras"&&b.publicacao)return false;
    if(f.sit){const st=bolSit(calcBol(b))[1];if(f.sit==="lo"&&!(st==="bad"||st==="warn"))return false;if(f.sit==="ok"&&st!=="ok")return false;if(f.sit==="sem"&&st!=="mute")return false}
    if(q&&!normTxt([alunoNome(b.alunoId),b.disciplina,b.escola,b.professor,b.turma,b.serie].join(" ")).includes(q))return false;return true})
  .sort((a,b)=>normTxt(alunoNome(a.alunoId)).localeCompare(normTxt(alunoNome(b.alunoId)))||(b.anoLetivo-a.anoLetivo)||((b.ordem||0)-(a.ordem||0))||discCmp(a.disciplina,b.disciplina))}
V.boletins=function(){
  const f=S.fBol,list=bolFiltrados();
  const anos=[...new Set(S.bol.map(b=>String(b.anoLetivo)))].sort().reverse(),pers=bolPeriodos(S.bol),discs=[...new Set(S.bol.map(b=>b.disciplina))].sort(discCmp);
  const lo=list.filter(b=>bolLo(calcBol(b))).length,nal=new Set(list.map(b=>b.alunoId)).size;
  return`<div class="head"><div><div class="eyebrow">Acompanhamento escolar</div><h1>Boletins</h1><p>Notas da escola regular de cada aluno, por disciplina e período letivo.</p></div>
  <div class="actions">${S.canWrite&&S.alunos.length?`<button class="btn primary" data-act="newBol">${ic("plus")}Novo boletim</button>`:""}</div></div>
  <div class="panel"><div class="panel-b"><div class="filters">
    <div class="fi grow"><label for="fb_q">Buscar por aluno, disciplina, escola ou professor</label><input id="fb_q" data-f="fBol.q" value="${esc(f.q)}" placeholder="Ex.: Miguel ou Matemática"></div>
    <div class="fi"><label for="fb_ano">Ano letivo</label><select id="fb_ano" data-f="fBol.ano">${opts(anos,f.ano,"Todos")}</select></div>
    <div class="fi"><label for="fb_per">Período</label><select id="fb_per" data-f="fBol.per">${opts(pers,f.per,"Todos")}</select></div>
    <div class="fi"><label for="fb_disc">Disciplina</label><select id="fb_disc" data-f="fBol.disc">${opts(discs,f.disc,"Todas")}</select></div>
    <div class="fi"><label for="fb_sit">Situação</label><select id="fb_sit" data-f="fBol.sit">${opts([["lo","Abaixo da média"],["ok","Na média"],["sem","Sem notas"]],f.sit,"Todas")}</select></div>
    <div class="fi"><label for="fb_pub">Família</label><select id="fb_pub" data-f="fBol.pub">${opts([["pub","Publicados"],["ras","Não publicados"]],f.pub,"Todos")}</select></div>
  </div></div>
  ${!S.ready.bol?loadingRows():list.length?`<div class="totline" style="padding:0 18px 12px"><span><b>${list.length}</b> ${list.length===1?"boletim":"boletins"}</span><span><b>${nal}</b> aluno${nal===1?"":"s"}</span>${lo?`<span style="color:var(--bad)"><b>${lo}</b> abaixo da média</span>`:""}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Aluno</th><th>Disciplina</th><th>Período</th><th class="r">Pontos</th><th>Aproveitamento</th><th>Situação</th><th>Família</th></tr></thead><tbody>
  ${list.map(b=>{const c=calcBol(b),[sl,sc]=bolSit(c),[pl,pc]=bolPub(b),w=c.pct==null?0:Math.round(c.pct*100);

async function empSalvar(btn){
  const form=$("#form");const d=readForm(form);const X=byId(S.acv,D.id);if(!X)return;const e={};const t=hoje();const mode=D.mode;const cur=X.emprestimo;
  if(!d.data)e.data="Informe a data.";else if(d.data>t)e.data="A data não pode ser no futuro.";
  if(mode==="emp"){
    if(cur){showErrs(form,{data:`Este item já está emprestado para ${empPessoa(cur)} até ${fmtD(cur.devolucao)}. Registre a devolução antes de emprestar de novo.`});return}
    const tipo=d.pessoaTipo||"aluno";
    if(tipo==="aluno"&&!d.alunoId)e.alunoId="Escolha o aluno.";
    if(tipo==="avulsa"&&!d.nome)e.nome="Informe o nome da pessoa.";
    const tel=digits(d.contato);if(tipo==="avulsa"&&!tel)e.contato="Informe um contato da pessoa avulsa.";else if(tel&&tel.length!==10&&tel.length!==11)e.contato="Telefone incompleto. Use (31) 9 9999-9999.";
    if(showErrs(form,e))return;
    const A=tipo==="aluno"?byId(S.alunos,d.alunoId):null;
    const emp={id:"e"+Math.random().toString(36).slice(2,10),pessoaTipo:tipo,alunoId:A?A.id:"",nome:A?A.nome:d.nome,contato:tel,data:d.data,devolucao:addDays(d.data,ACV_PRAZO),observacoes:d.observacoes,reemprestimos:[],por:S.uid,em:nowISO()};
    const n=strip(X);n.emprestimo=emp;n.historico=pushHist(X.historico,hist("Emprestou",`${emp.nome} (${empPessoaTipo(emp)}) em ${fmtD(emp.data)} · devolução ${fmtD(emp.devolucao)}`));
    busy(btn,true);const ok=await put("acervo","acv",X.id,n);busy(btn,false);
    if(ok){if(A)await addAlunoHist(A.id,"Pegou item do acervo",`${X.titulo} · devolução ${fmtD(emp.devolucao)}`);toast(`Empréstimo registrado. Devolução em ${fmtD(emp.devolucao)}.`);empVoltar()}
    return}
  if(!cur){toast("Este item não está mais emprestado.",true);empVoltar();return}
  if(d.data&&d.data<cur.data)e.data=`A data não pode ser anterior ao empréstimo (${fmtD(cur.data)}).`;
  if(showErrs(form,e))return;
  const n=strip(X);
  if(mode==="reemp"){const nova=addDays(d.data,ACV_PRAZO);
    n.emprestimo={...cur,devolucao:nova,reemprestimos:[...(cur.reemprestimos||[]),{data:d.data,anterior:cur.devolucao,nova,observacoes:d.observacoes,por:S.uid,em:nowISO()}]};
    n.historico=pushHist(X.historico,hist("Registrou reempréstimo",`${empPessoa(cur)} em ${fmtD(d.data)} · devolução ${fmtD(cur.devolucao)} → ${fmtD(nova)}`));
    busy(btn,true);const ok=await put("acervo","acv",X.id,n);busy(btn,false);if(ok){toast(`Reempréstimo registrado. Nova devolução em ${fmtD(nova)}.`);empVoltar()}return}
  n.emprestimo=null;n.emprestimos=[...(X.emprestimos||[]),{...cur,devolvidoEm:d.data,obsDevolucao:d.observacoes,devolvidoPor:S.uid}].slice(-200);
  n.historico=pushHist(X.historico,hist("Registrou devolução",`${empPessoa(cur)} devolveu em ${fmtD(d.data)}${d.data>cur.devolucao?` (${diasEntre(cur.devolucao,d.data)} dia(s) de atraso)`:""}`));
  busy(btn,true);const ok=await put("acervo","acv",X.id,n);busy(btn,false);if(ok){toast("Devolução registrada. O item está disponível de novo.");empVoltar()}
}

function finFiltrados(){const f=S.fFin,q=normTxt(f.q);return S.lanc.filter(l=>(!f.de||l.data>=f.de)&&(!f.ate||l.data<=f.ate)&&(!f.tipo||l.tipo===f.tipo)&&(!f.cat||l.categoria===f.cat)&&(!f.st||stLanc(l)===f.st)&&(!f.aluno||l.alunoId===f.aluno)&&(!q||normTxt(l.descricao+" "+alunoNome(l.alunoId)+" "+(l.observacoes||"")).includes(q))).sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||"").localeCompare(b.criadoEm||""))}
function totais(list){const v=list.filter(l=>l.situacao!=="cancelado");const sum=(t,p)=>v.filter(l=>l.tipo===t&&(!p||l.situacao==="pago")).reduce((s,l)=>s+(l.valor||0),0);const r=sum("receita"),d=sum("despesa"),rp=sum("receita",1),dp=sum("despesa",1);return{r,d,rp,dp,saldo:r-d,saldoR:rp-dp}}

  const alunosOpt=S.alunos.slice().sort((a,b)=>normTxt(a.nome).localeCompare(normTxt(b.nome))).map(a=>[a.id,a.nome]);

      <div class="fi"><label for="ff_t">Tipo</label><select id="ff_t" data-f="fFin.tipo">${opts([["receita","Receitas"],["despesa","Despesas"]],f.tipo,"Todos")}</select></div>

      <div class="fi grow"><label for="ff_q">Buscar</label><input id="ff_q" data-f="fFin.q" value="${esc(f.q)}" placeholder="Descrição ou observação"></div>
    </div>
  </div></div>
  <div class="kpis">

  <div class="panel"><div class="panel-h"><h2>${list.length} lançamento${list.length===1?"":"s"}</h2><span class="small muted">${f.de||f.ate?`${fmtD(f.de)} a ${fmtD(f.ate)}`:"Todo o período"} · cancelados não entram nos totais</span></div>

  </tbody></table></div>`:S.lanc.length?`<div class="empty"><h3>Nenhum lançamento neste período</h3><p>Mude o período ou os filtros para ver outros lançamentos.</p></div>`:`<div class="empty"><h3>Nenhum lançamento registrado ainda</h3><p>Registre mensalidades, matrículas e despesas como aluguel e materiais. Com valores de mensalidade nos cadastros, "Gerar mensalidades" cria as cobranças do mês de uma vez.</p>${S.canWrite?`<button class="btn primary" data-act="newLanc">${ic("plus")}Registrar lançamento</button>`:""}</div>`}
  </div>`;
};
function periodoAtivo(){const f=S.fFin;if(!f.de&&!f.ate)return"tudo";const m=monthRange(0),a=monthRange(-1),p=monthRange(1),y=new Date().getFullYear();if(f.de===m[0]&&f.ate===m[1])return"mes";if(f.de===a[0]&&f.ate===a[1])return"ant";if(f.de===p[0]&&f.ate===p[1])return"prox";if(f.de===y+"-01-01"&&f.ate===y+"-12-31")return"ano";return""}

function fld(name,label,val,o={}){
  const id="f_"+name;const t=o.type||"text";let ctrl;
  if(o.options)ctrl=`<select id="${id}" name="${name}"${o.disabled?" disabled":""}${o.extra||""}>${opts(o.options,val,o.empty)}</select>`;
  else if(t==="textarea")ctrl=`<textarea id="${id}" name="${name}" rows="${o.rows||3}"placeholder="${esc(o.ph||"")}">${esc(val)}</textarea>`;
  else ctrl=`<input id="${id}" name="${name}" type="${t}" value="${esc(val)}"${o.list?` list="${o.list}"`:""}${o.ph?` placeholder="${esc(o.ph)}"`:""}${o.inputmode?` inputmode="${o.inputmode}"`:""}${o.extra||""}>`;
  return`<div class="field${o.full?" full":""}${o.cls?" "+o.cls:""}" data-field="${name}"${o.hidden?" hidden":""}><label for="${id}">${esc(label)}${o.req?' <span class="req">*</span>':""}</label>${ctrl}${o.hint?`<small class="hint">${esc(o.hint)}</small>`:""}<small class="ferr" hidden></small></div>`;
}
function readForm(form){const d={};form.querySelectorAll("[name]").forEach(el=>{if(el.type==="radio"){if(el.checked)d[el.name]=el.value}else if(el.type==="checkbox")d[el.name]=el.checked;else d[el.name]=el.value.trim()});return d}
function showErrs(form,errs){
  form.querySelectorAll(".field").forEach(f=>{f.classList.remove("err");const e=f.querySelector(".ferr");if(e){e.hidden=true;e.textContent=""}});
  const keys=Object.keys(errs);const box=$("#d-errs");
  if(!keys.length){if(box)box.hidden=true;return false}
  const labels=[];keys.forEach(k=>{const f=form.querySelector(`[data-field="${k}"]`);if(f){f.classList.add("err");const e=f.querySelector(".ferr");e.textContent=errs[k];e.hidden=false;labels.push((f.querySelector("label")||{textContent:k}).textContent.replace("*","").trim())}else labels.push(errs[k])});
  if(box){box.hidden=false;box.innerHTML=`<b>Não foi possível salvar.</b> Corrija ${keys.length===1?"o campo":"os campos"}: ${esc(labels.join(", "))}.`}
  const first=form.querySelector(".field.err input,.field.err select,.field.err textarea");if(first)first.focus();
  return true;
}

function closeDrawer(all){if(!all&&D&&D.backPend){$("#drawer").hidden=true;$("#scrim").hidden=true;D=null;document.body.style.overflow="";pendDrawer();return}const back=!all&&D&&D.back;$("#drawer").hidden=true;$("#scrim").hidden=true;$("#drawer").innerHTML="";document.body.style.overflow="";D=null;if(back&&byId(S.alunos,back.id))alunoDrawer(back.id,null,null,back.tab)}

function valLead(d,L){const e={};if(!d.nome)e.nome="Informe o nome.";
  if(!d.telefone&&!d.email&&!d.instagram)e.telefone="Informe pelo menos um meio de contato: telefone, e-mail ou Instagram.";
  if(d.telefone&&digits(d.telefone).length<10)e.telefone="Informe o telefone com DDD, ex.: (31) 99999-9999.";
  if(d.email&&!EMAIL.test(d.email))e.email="E-mail incompleto ou inválido.";
  if(!d.dataEntrada)e.dataEntrada="Informe a data de entrada.";
  if(d.status==="matriculado"&&!(L&&L.alunoId))e.status="Para matricular, use o botão \"Converter em aluno\".";
  return e}
async function saveLead(btn){
  const form=$("#form");const d=readForm(form);const L=D.id?byId(S.leads,D.id):null;
  if(L&&L.alunoId)d.status="matriculado";
  if(showErrs(form,valLead(d,L)))return;
  d.telefone=digits(d.telefone);
  const novo={...(L?strip(L):{interacoes:[],historico:[],criadoEm:nowISO(),criadoPor:S.uid,alunoId:null}),...d};
  if(L){const ch=diff(L,novo,LEAD_F);if(!ch.length){toast("Nenhuma alteração para salvar.");return}novo.historico=pushHist(L.historico,hist("Alterou",ch.join("; ")))}
  else novo.historico=[hist("Cadastrou o lead")];
  const id=D.id||newId("leads");busy(btn,true);
  const ok=await put("leads","leads",id,novo);busy(btn,false);
  if(ok){toast(L?"Lead atualizado.":"Lead cadastrado.");leadDrawer(id,{id,...novo})}
}
async function addInter(btn){
  const L=byId(S.leads,D.id);if(!L)return;const f=$("#iform");const d=readForm(f);
  f.querySelectorAll(".field").forEach(x=>x.classList.remove("err"));
  if(!d.itexto){const fd=f.querySelector('[data-field="itexto"]');fd.classList.add("err");const e=fd.querySelector(".ferr");e.textContent="Descreva a interação.";e.hidden=false;fd.querySelector("textarea").focus();return}
  const novo=strip(L);novo.interacoes=[...(L.interacoes||[]),{data:d.idata||hoje(),registradoEm:nowISO(),por:S.uid,tipo:d.itipo,texto:d.itexto}].slice(-200);
  let det=`${d.itipo} em ${fmtD(d.idata||hoje())}`;
  if(L.status==="novo"){novo.status="em_contato";det+="; Status: Novo → Em contato"}
  novo.historico=pushHist(L.historico,hist("Registrou interação",det));
  busy(btn,true);const ok=await put("leads","leads",L.id,novo);busy(btn,false);
  if(ok){toast("Interação registrada.");D.keepFocus=true;leadDrawer(L.id,{id:L.id,...novo})}
}

function refreshAlunoPanes(){
  const A=byId(S.alunos,D.id);if(!A)return;const id=A.id,t=hoje();
  // Aulas
  const au=S.aulas.filter(a=>a.alunoId===id);const m0=t.slice(0,7);
  const doMes=au.filter(a=>a.data.slice(0,7)===m0);
  const prox=au.filter(a=>a.data>=t&&a.situacao==="agendada").sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));
  const ult=au.filter(a=>!(a.data>=t&&a.situacao==="agendada")).sort((a,b)=>(b.data+b.inicio).localeCompare(a.data+a.inicio));
  const linhaAula=a=>`<div class="li" data-act="openAula" data-id="${a.id}" tabindex="0"><div><div class="cell-main">${DIAS[wd(a.data)]}, ${fmtD(a.data)} · ${esc(a.inicio||"")}–${esc(a.fim||"")}</div><div class="cell-sub">${esc([a.profissional,discNomes(a).join(", ")||a.tema].filter(Boolean).join(" · ")||a.modalidade||"")}</div>${a.observacoes&&a.situacao!=="agendada"?`<div class="cell-sub" style="white-space:pre-wrap">${esc(a.observacoes.slice(0,160))}${a.observacoes.length>160?"…":""}</div>`:""}</div>${pill(AULA_ST,aulaPendente(a)?"agendada":a.situacao)}</div>`;
  const pa=$("#pane_aulas");if(pa)pa.innerHTML=`<div class="sec-h"><h3>Aulas</h3>${S.canWrite?`<div class="actions"><button class="btn sm" data-act="horAulas">${ic("cal")}Agendar pelos horários fixos</button><button class="btn sm" data-act="newAula" data-aluno="${id}">${ic("plus")}Aula avulsa</button></div>`:""}</div>
    ${(A.horarios||[]).length?`<p class="small muted mt0">Horários fixos: ${esc(horTxt(A.horarios))}</p>`:""}
    <div class="stats"><div class="stat"><b>${doMes.filter(a=>a.situacao==="realizada").length}</b>realizadas no mês</div><div class="stat"><b>${doMes.filter(a=>a.situacao==="falta").length}</b>faltas no mês</div><div class="stat"><b>${doMes.filter(a=>a.situacao==="falta_just").length}</b>justificadas</div><div class="stat"><b>${prox.length}</b>agendadas</div></div>
    <p class="sub-h">Próximas</p>${prox.length?`<div class="list">${prox.slice(0,6).map(linhaAula).join("")}</div>`:`<p class="muted small mt0">Nenhuma aula agendada.</p>`}
    <p class="sub-h">Anteriores e registros</p>${ult.length?`<div class="list">${ult.slice(0,12).map(linhaAula).join("")}</div>`:`<p class="muted small mt0">Nenhuma aula anterior.</p>`}`;
  // Financeiro
  const fin=S.lanc.filter(l=>l.alunoId===id).sort((a,b)=>b.data.localeCompare(a.data));
  const ab=fin.filter(l=>l.situacao!=="cancelado"&&l.situacao!=="pago").reduce((s,l)=>s+(l.valor||0),0);
  const atr=fin.filter(l=>stLanc(l)==="atrasado").reduce((s,l)=>s+(l.valor||0),0);

function valAluno(d,hs){const e={},ob=S.cfg.obrig,t=hoje();

function conflitos(d,selfId,datas){

/* ---------- Google Meet pelo conector Google Calendar ---------- */
let MCPp=null;
function mcpGet(){if(!MCPp){const C=window.claude;MCPp=(C&&C.use?C.use("mcp"):Promise.resolve(null)).catch(()=>null)}return MCPp}
function meetLinkDe(ev){ev=ev||{};const cd=ev.conferenceData||{};return ev.conferenceUrl||(cd.videoEntryPoint&&cd.videoEntryPoint.uri)||((cd.entryPoints||[]).find(e=>e.entryPointType==="video")||{}).uri||ev.hangoutLink||""}
async function criarMeet(o){const m=await mcpGet();if(!m)throw{code:"not_granted"};
  const inp={summary:o.titulo,startTime:`${o.data}T${o.inicio}:00`,endTime:`${o.data}T${o.fim}:00`,addGoogleMeetUrl:true};if(o.descricao)inp.description=o.descricao;if(o.email)inp.attendees=[{email:o.email}];
  const r=await m.callTool("Google Calendar","create_event",inp);const p=(r&&r.payload)||{};const ev=p.event||p;
  return{link:meetLinkDe(ev),eventId:ev.id||"",html:ev.htmlLink||""}}
function meetErro(e){const c=e&&e.code;
  if(c==="server_not_connected")return"A sua conta Google ainda não está conectada. Conecte em Conta e equipe › Google Agenda e tente de novo.";
  if(c==="server_not_configured")return"A integração com o Google Agenda não foi configurada neste servidor. Use \"Inserir link\" por enquanto.";
  if(c==="needs_reauth")return"A conexão com o Google Agenda expirou. Reconecte em Conta e equipe › Google Agenda.";
  if(c==="not_in_manifest")return"Integração não disponível.";
    if(c==="blocked_by_policy"||c==="approval_required")return"A sua organização não permite criar eventos do Google Calendar por esta página.";
  if(c==="permission_denied")return"Somente a equipe pode criar salas do Google Meet.";
  if(c==="unavailable")return"Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if(c==="tool_error")return"O Google Calendar recusou o pedido: "+(e.message||"sem detalhe")+".";
  if(c==="server_unavailable"||c==="upstream_error"||c==="cancelled")return"O Google Calendar não respondeu. Antes de tentar de novo, confira na sua agenda do Google se o evento já foi criado.";
  return"Não foi possível criar a sala agora ("+(c||"erro")+")."}
function meetPainel(){return`<div style="display:grid;gap:8px"><p class="small mt0">Cria um evento na sua agenda do Google com sala do Google Meet e preenche o link aqui.</p>
  <div class="actions"><button type="button" class="btn sm primary" data-act="meetCriar">Criar sala no Google Meet</button><a class="btn sm" href="https://meet.google.com/new" target="_blank" rel="noopener" data-act="extLink">Abrir o Meet manualmente</a></div>
  <small class="hint" id="meet_st" aria-live="polite"></small></div>`}
async function meetCriar(btn){if(D.meet){toast("A sala já foi criada. Salve para guardar o link.");return}
  const f=readForm($("#form"));if(!f.data||!f.inicio||!f.fim||f.fim<=f.inicio){toast("Preencha data, início e término antes de criar a sala.",true);return}

async function saveAval(btn,keep,silent){

  const campos={alunoId:D.alunoId,data:d.data,tipo:d.tipo,referenciaTipo:d.referenciaTipo,referencia:d.referencia,periodo:d.periodo,professor:d.professor,niveis,descritivo:d.descritivo,avancos:d.avancos,atencao:d.atencao,proximos:d.proximos,familia:d.familia,interno:d.interno};
  const novo={...(Av?strip(Av):{historico:[],criadoEm:nowISO(),criadoPor:S.uid}),...campos};
  if(Av){const ch=diff(Av,novo,AVAL_F);if(!ch.length){if(!silent)toast("Nenhuma alteração para salvar.");return Av.id}novo.historico=pushHist(Av.historico,hist("Alterou",ch.join("; ")))}
  else novo.historico=[hist("Registrou a avaliação")];

  busy(btn,true);const id=D.id||newId("avaliacoes");const ok=await put("avaliacoes","aval",id,novo);busy(btn,false);

/* ---------- Boletim escolar ---------- */
const BOL_BONUS="Bônus (ponto extra)",BOL_SUB="Prova substitutiva";
const BOL_TIPOS=["Prova","Teste","Trabalho","Atividade","Simulado","Participação",BOL_BONUS,BOL_SUB,"Outro"];
const BOL_REG=BOL_TIPOS.filter(t=>t!==BOL_BONUS&&t!==BOL_SUB);
const BOL_PT={Bimestre:4,Trimestre:3,Semestre:2,Anual:1};
const DISC_STD=["Língua Portuguesa","Matemática","Ciências","Ciências da Natureza","História","Geografia","Língua Inglesa","Arte","Educação Física","Literatura","Redação","Ensino Religioso","Física","Química","Biologia","Filosofia","Sociologia","Espanhol"];
const BOL_F={escola:"Escola",matricula:"Matrícula",anoLetivo:"Ano letivo",periodo:"Período",serie:"Série/ano",turma:"Turma",disciplina:"Disciplina",professor:"Professor(a)",media:"Média para aprovação",pontosFortes:"Pontos fortes",aDesenvolver:"Pontos a desenvolver",anotacoes:"Anotações do professor",comentarioGeral:"Comentário da nota avaliativa",interno:"Observações internas"};
const r2=x=>Math.round((+x||0)*100)/100;
const fmtN=x=>x==null||x===""||Number.isNaN(x)?"—":String(r2(x)).replace(".",",");
const numIn=x=>x==null||x===""?"":String(x).replace(".",",");
const pctTxt=p=>p==null?"—":Math.round(p*100)+"%";
function parseNum(s){s=String(s==null?"":s).trim().replace(/\s/g,"");if(!s)return null;s=s.replace(",",".");if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;return Number(s)}
const okN=x=>x!=null&&!Number.isNaN(x);
const perLabel=(t,n)=>t==="Anual"?"Anual":`${n}º ${String(t||"").toLowerCase()}`;
const perOrdem=(t,n)=>{const c=BOL_PT[t]||1;return r2((Math.min(n,c)-.5)/c)};
const bolPub=x=>{const[a,b]=pubState(x);return[a.replace("Publicada","Publicado").replace("Alterada","Alterado").replace("Agendada","Agendado"),b]};
const bolTitulo=b=>`${b.disciplina} · ${b.periodo} de ${b.anoLetivo}`;
const discIdx=d=>{const i=DISC_STD.findIndex(x=>normTxt(x)===normTxt(d));return i<0?99:i};
const discCmp=(a,b)=>discIdx(a)-discIdx(b)||normTxt(a).localeCompare(normTxt(b));
const bolSortDesc=(a,b)=>(b.anoLetivo-a.anoLetivo)||((b.ordem||0)-(a.ordem||0))||(b.atualizadoEm||"").localeCompare(a.atualizadoEm||"");
const atvId=()=>"a"+Math.random().toString(36).slice(2,10);
const BOL_MODELO=()=>[{id:atvId(),nome:"Prova 1",tipo:"Prova",data:"",valor:10,nota:null},{id:atvId(),nome:"Trabalho 1",tipo:"Trabalho",data:"",valor:5,nota:null},{id:atvId(),nome:"Atividade em sala",tipo:"Atividade",data:"",valor:2,nota:null}];
const copyAtv=list=>(list||[]).map(a=>({...a,id:atvId(),nota:null}));

function calcBol(b){
  const at=b.atividades||[];const isB=a=>a.tipo===BOL_BONUS,isS=a=>a.tipo===BOL_SUB;
  const reg=at.filter(a=>!isB(a)&&!isS(a)&&okN(a.valor)&&a.valor>0);
  const nota={};reg.forEach(a=>{if(okN(a.nota))nota[a.id]=a.nota});
  const subst={},usou={};
  at.filter(a=>isS(a)&&okN(a.nota)&&okN(a.valor)&&a.valor>0).forEach(s=>{
    const c=reg.filter(a=>a.tipo===(s.substitui||"Prova")&&nota[a.id]!=null&&!subst[a.id]);if(!c.length)return;
    const low=c.reduce((m,a)=>nota[a.id]/a.valor<nota[m.id]/m.valor?a:m);
    if(s.nota/s.valor>nota[low.id]/low.valor){nota[low.id]=r2(Math.min(1,s.nota/s.valor)*low.valor);subst[low.id]=s.id;usou[s.id]=low.id}});
  const possivel=r2(reg.reduce((x,a)=>x+a.valor,0));
  const avaliado=r2(reg.filter(a=>nota[a.id]!=null).reduce((x,a)=>x+a.valor,0));
  const base=r2(Object.values(nota).reduce((x,v)=>x+v,0));
  const bonus=r2(at.filter(a=>isB(a)&&okN(a.nota)).reduce((x,a)=>x+a.nota,0));
  const obtido=possivel?Math.min(possivel,r2(base+bonus)):r2(base+bonus);
  const completo=reg.length>0&&reg.every(a=>nota[a.id]!=null);
  const media=okN(+b.media)&&+b.media>0?+b.media:60;
  return{possivel,avaliado,base,bonus,bonusUsado:r2(obtido-base),obtido,completo,media,nota,subst,usou,
    pct:possivel?obtido/possivel:null,pctAval:avaliado?Math.min(1,(base+bonus)/avaliado):null,temNota:avaliado>0}
}
function bolSit(c){if(!c.temNota)return["Sem notas","mute"];const p=c.completo?c.pct:c.pctAval;if(p==null)return["Sem notas","mute"];const lo=p*100<c.media-1e-9;
  if(c.completo)return lo?["Abaixo da média","bad"]:["Na média","ok"];return lo?["Abaixo da média até agora","warn"]:["Na média até agora","ok"]}
const bolLo=c=>{const s=bolSit(c)[1];return s==="bad"||s==="warn"};
function bolFalta(c){if(!c.possivel||!c.temNota)return"";const alvo=r2(c.media/100*c.possivel),f=r2(alvo-c.obtido),resta=r2(c.possivel-c.avaliado);
  if(c.completo)return f>0?`Ficou ${fmtN(f)} ponto${f===1?"":"s"} abaixo da média do período (${fmtN(alvo)} de ${fmtN(c.possivel)}).`:`Alcançou a média do período (${fmtN(alvo)} de ${fmtN(c.possivel)}).`;
  if(f<=0)return`Já alcançou a média do período (${fmtN(alvo)} pontos).`;
  return f>resta?`Faltam ${fmtN(f)} pontos para a média (${fmtN(alvo)}), e restam só ${fmtN(resta)} pontos a avaliar: a recuperação pode ser necessária.`:`Faltam ${fmtN(f)} pontos para a média (${fmtN(alvo)}). Ainda restam ${fmtN(resta)} pontos a avaliar.`}
function bolTotHTML(c){const[sl,sc]=bolSit(c);
  return`<div class="stats"><div class="stat"><b>${fmtN(c.possivel)}</b>pontos possíveis</div><div class="stat"><b>${fmtN(c.obtido)}</b>pontos obtidos${c.bonusUsado?` (com ${fmtN(c.bonusUsado)} de bônus)`:""}</div><div class="stat"><b>${pctTxt(c.pct)}</b>do total do período</div>${!c.completo&&c.temNota?`<div class="stat"><b>${pctTxt(c.pctAval)}</b>de aproveitamento nos ${fmtN(c.avaliado)} pontos já avaliados</div>`:""}</div>
  <p class="small mt0"><span class="pill p-${sc}">${esc(sl)}</span> &nbsp;Média: ${fmtN(c.media)}%. ${esc(bolFalta(c))}</p>`}

function readAtv(){return[...document.querySelectorAll("#atv .at-row")].map(r=>{const g=k=>{const e=r.querySelector(`[data-k="${k}"]`);return e?e.value.trim():""};

function valAtv(list,live){const errs={};

  const novo={...(B?strip(B):{historico:[],criadoEm:nowISO(),criadoPor:S.uid}),...campos};
  if(B){const ch=diff(B,novo,BOL_F);if((B.notaGeral??null)!==(novo.notaGeral??null))ch.push(`Nota avaliativa: ${fmtN(B.notaGeral)} → ${fmtN(novo.notaGeral)}`);ch.push(...atvDiff(B.atividades,atividades));
    if(!ch.length){if(!silent)toast("Nenhuma alteração para salvar.");return B.id}novo.historico=pushHist(B.historico,hist("Alterou",ch.join("; ")))}
  else{const c=calcBol(novo);novo.historico=[hist("Registrou o boletim",`${atividades.length} atividade${atividades.length===1?"":"s"} · ${fmtN(c.obtido)} de ${fmtN(c.possivel)} pontos`)]}

  if(keep){const back=D.back;bolDrawer(id);D.back=back}else closeDrawer();

function pdiSt(P){if(!P||!(P.versoes||[]).length)return["Rascunho","mute"];if(P.status==="final")return[`Versão final ${P.versao}`,"ok"];return[`Em revisão (após a versão ${P.versao})`,"warn"]}

function pdiResumoObj(list){list=list||[];const ok=list.filter(o=>o.progresso==="ok").length;return list.length?`${ok} de ${list.length} objetivo${list.length===1?"":"s"} atingido${list.length===1?"":"s"}`:"Sem objetivos"}
function pdiAlertas(){const t=hoje(),lim=addDays(t,7),out=[];
  S.pdi.filter(P=>P.revisaoEm&&P.revisaoEm<=lim&&byId(S.alunos,P.alunoId)).sort((a,b)=>a.revisaoEm.localeCompare(b.revisaoEm)).forEach(P=>{const nm=alunoNome(P.alunoId);

    else out.push({sev:"info",hoje:P.revisaoEm===t,t:`${P.revisaoEm===t?"Hoje":"Em "+fmtD(P.revisaoEm)}: revisão do PDI de ${nm}`,d:`${pdiResumoObj(P.objetivos)} · responsável: ${P.profissional||"—"}`,act:"openPdi",attrs:`data-id="${esc(P.id)}"`,go:"Abrir PDI"})});

  try{U=await C.use("user")}catch(_){U=null}
  if(U){try{const me=await U.me();S.uid=me.id;S.meName=me.name||"";const can=await U.can("data.write");S.canWrite=can!==false;S.isAdmin=!!(me.isOwner||me.canEdit);S.gestor=!!me.isOwner;
    $("#me").innerHTML=`<img alt="" src="${esc(me.avatarUrl)}"><div><b>${esc(me.name||"Você")}</b>${S.gestor?"Administração":S.isAdmin?"Equipe":"Consulta"}<div class="me-links"><a href="${esc(VX.contaUrl||"conta")}">Conta e equipe</a><form method="post" action="/logout"><button type="submit">Sair</button></form></div></div>`}catch(_){}}
  try{DL=await C.use("downloads")}catch(_){DL=null}
  let staff=S.isAdmin;
  if(!staff&&U){try{staff=(await U.can("data.write"))===true}catch(_){}}
  if(!staff){try{staff=(await db.doc("sistema/equipe").get()).exists}catch(_){}}
  if(!staff){let turma=false;try{turma=(await db.doc("lv_acesso/turma").get()).exists}catch(_){}
    S.conn="ok";if(turma){S.mode="aluno";render();return}
    S.mode="familia";render();let tk=null;try{tk=localStorage.getItem(LS_KEY)}catch(_){}if(tk)portalEntrar(tk,true);return}
  if(S.isAdmin){try{if(!(await db.doc("sistema/equipe").get()).exists)await db.doc("sistema/equipe").set({criadoEm:nowISO()})}catch(_){}
    try{if(!(await db.doc("lv_acesso/turma").get()).exists)await db.doc("lv_acesso/turma").set({criadoEm:nowISO()})}catch(_){}}
  try{AS=await C.use("assets")}catch(_){AS=null}
  S.conn="ok";
  const sub=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));S.ready[key]=true;scheduleRender()},err=>{S.ready[key]=true;if(err&&err.code==="revoked"){S.conn="off"}scheduleRender()});
  sub("leads","leads");sub("alunos","alunos");sub("lancamentos","lanc");sub("aulas","aulas");sub("anexos","anexos");sub("avaliacoes","aval");sub("boletins","bol");sub("acervo","acv");sub("pdis","pdi");sub("reunioes","reu");if(S.isAdmin)sub("familias","fam");
  db.doc("ajustes/geral").onSnapshot(s=>{S.cfg=mergeCfg(s.exists?s.data():null);scheduleRender()},()=>{});
  render();
}
boot();
})();
</script>
